name: CI Full Repository Certification

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static:
    name: Full / Static / Config / Auth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Node.js and npm versions
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: CI workflow contract tests
        run: npm run test:ci-config
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Backend typecheck
        run: npm run typecheck:server
      - name: Runtime configuration tests
        run: npm run test:config
      - name: EVE SSO JWT validation tests
        run: npm run test:auth-token

  unit_domain:
    name: Full / Unit / Domain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Node.js and npm versions
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Catalog & Universe truth tests
        run: npm run test:truth
      - name: Corporation Treasury & ESI boundary tests
        run: npm run test:corporation-boundary
      - name: Unit tests
        run: npm test

  server:
    name: Full / Server / API / Security / ESI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Node.js and npm versions
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: API integration tests
        run: npm run test:api
      - name: Server smoke test
        run: npm run test:smoke
      - name: Security hardening tests
        run: npm run test:security
      - name: ESI hardening & mock tests
        run: npm run test:esi

  build:
    name: Full / Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Node.js and npm versions
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build

  browser-auth:
    name: Full / Browser Auth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Node.js and npm versions
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser Auth E2E
        run: npm run test:e2e:auth
      - name: Upload Auth Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: full-playwright-report-auth
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  browser-operations:
    name: Full / Browser Operations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Node.js and npm versions
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser Operations E2E
        run: npm run test:e2e:operations
      - name: Upload Operations Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: full-playwright-report-operations
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  sde-truth:
    name: Full / SDE Truth
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SDE_BUILD: '3503375'
      SDE_URL: 'https://developers.eveonline.com/static-data/tranquility/eve-online-static-data-3503375-jsonl.zip'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
      - name: Verify Node.js and npm versions
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Download pinned CCP SDE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eve-sde"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            "$SDE_URL" --output "$RUNNER_TEMP/eve-sde/sde.zip"
          unzip -q "$RUNNER_TEMP/eve-sde/sde.zip" -d "$RUNNER_TEMP/eve-sde/unpacked"
          SYSTEMS_FILE="$(find "$RUNNER_TEMP/eve-sde/unpacked" -type f -name 'mapSolarSystems.jsonl' -print -quit)"
          STARGATES_FILE="$(find "$RUNNER_TEMP/eve-sde/unpacked" -type f -name 'mapStargates.jsonl' -print -quit)"
          test -n "$SYSTEMS_FILE"
          test -n "$STARGATES_FILE"
          mkdir -p "$RUNNER_TEMP/eve-sde/input"
          cp "$SYSTEMS_FILE" "$RUNNER_TEMP/eve-sde/input/mapSolarSystems.jsonl"
          cp "$STARGATES_FILE" "$RUNNER_TEMP/eve-sde/input/mapStargates.jsonl"
      - name: Generate real canonical graph
        run: |
          set -euo pipefail
          node scripts/build-universe-graph.mjs \
            "$RUNNER_TEMP/eve-sde/input" \
            src/data/universeGraph.json \
            "$SDE_BUILD"
          node scripts/write-universe-graph-manifest.mjs \
            src/data/universeGraph.json \
            src/data/universeGraphManifest.ts
      - name: Validate generated graph is committed cleanly
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          test -s src/data/universeGraph.json
          test -s src/data/universeGraphManifest.ts
      - name: Verify generated canonical artifact matches commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/universeGraph.json src/data/universeGraphManifest.ts; then
            echo 'Canonical SDE graph artifact and manifest match the pinned CCP SDE regeneration.'
            exit 0
          fi
          echo '::error::Committed canonical SDE artifact does not match the pinned CCP SDE regeneration.'
          git diff --stat -- src/data/universeGraph.json src/data/universeGraphManifest.ts
          git diff -- src/data/universeGraphManifest.ts
          echo 'Full SDE certification is read-only. Regenerate and commit the artifact explicitly in a reviewed change.'
          exit 1

  full-gate:
    name: CI / full-certification-gate
    if: ${{ always() }}
    needs: [static, unit_domain, server, build, browser-auth, browser-operations, sde-truth]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify full certification result
        shell: bash
        run: |
          set -euo pipefail
          echo "Full certification head: ${{ github.sha }}"
          test "${{ needs.static.result }}" = "success"
          test "${{ needs.unit_domain.result }}" = "success"
          test "${{ needs.server.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.browser-auth.result }}" = "success"
          test "${{ needs.browser-operations.result }}" = "success"
          test "${{ needs.sde-truth.result }}" = "success"

  observability:
    name: CI / observability
    if: ${{ always() }}
    needs: [full-gate]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
      - name: Verify Node.js and npm versions
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Collect CI timing and churn metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_OBSERVABILITY_FILE: ${{ runner.temp }}/ci-observability.json
          CI_CERTIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-observability.mjs
      - name: Upload CI observability metrics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-observability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-observability.json
          if-no-files-found: error
          retention-days: 30
