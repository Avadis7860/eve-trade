name: CI Main Post-Merge Smoke

on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-smoke:
    name: CI / main-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Node.js and npm versions
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Server smoke test
        run: npm run test:smoke
      - name: Production build
        run: npm run build

  observability:
    name: CI / observability
    if: ${{ always() }}
    needs: [main-smoke]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
      - name: Verify Node.js and npm versions
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Collect CI timing and churn metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_OBSERVABILITY_FILE: ${{ runner.temp }}/ci-observability.json
        run: node scripts/ci-observability.mjs
      - name: Upload CI observability metrics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-observability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-observability.json
          if-no-files-found: error
          retention-days: 30
