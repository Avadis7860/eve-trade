name: CI Foundation & Regression Gate

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: CI / Change Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      domain: ${{ steps.scope.outputs.domain }}
      server: ${{ steps.scope.outputs.server }}
      sde: ${{ steps.scope.outputs.sde }}
      ci: ${{ steps.scope.outputs.ci }}
      config: ${{ steps.scope.outputs.config }}
      tests: ${{ steps.scope.outputs.tests }}
      docs: ${{ steps.scope.outputs.docs }}
      ambiguous: ${{ steps.scope.outputs.ambiguous }}
      run_static: ${{ steps.scope.outputs.run_static }}
      full_certification: ${{ steps.scope.outputs.full_certification }}
      run_unit_domain: ${{ steps.scope.outputs.run_unit_domain }}
      run_server: ${{ steps.scope.outputs.run_server }}
      run_build: ${{ steps.scope.outputs.run_build }}
      run_browser: ${{ steps.scope.outputs.run_browser }}
    steps:
      - name: Checkout pull request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed domains
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo 'Base commit is not present locally; falling back conservatively to full certification.'
            changed_files=''
            ambiguous=true
          else
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            ambiguous=false
          fi

          printf "%s\n" "$changed_files" | node scripts/__tests__/ci_scope.test.mjs >/dev/null
          printf "%s\n" "$changed_files" | node scripts/ci-scope.mjs

          # ci-scope.mjs writes GitHub outputs and the scope summary.
  static:
    name: Static / Config / Auth
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.run_static == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Node.js and npm versions
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: CI workflow contract tests
        run: npm run test:ci-config
      - name: Agent context integrity
        env:
          CONTEXT_BRANCH: ${{ github.head_ref }}
          CONTEXT_PR_NUMBER: ${{ github.event.pull_request.number }}
          CONTEXT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run test:context
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Backend typecheck
        run: npm run typecheck:server
      - name: Runtime configuration tests
        run: npm run test:config
      - name: EVE SSO JWT validation tests
        run: npm run test:auth-token

  unit_domain:
    name: Unit / Domain Certification
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.run_unit_domain == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Node.js and npm versions
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Catalog & Universe truth tests
        run: npm run test:truth
      - name: Corporation Treasury & ESI boundary tests
        run: npm run test:corporation-boundary
      - name: Unit tests
        run: npm test

  server:
    name: Server / API / Security / ESI
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.run_server == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Node.js and npm versions
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: API integration tests
        run: npm run test:api
      - name: Server smoke test
        run: npm run test:smoke
      - name: Security hardening tests
        run: npm run test:security
      - name: ESI hardening & mock tests
        run: npm run test:esi

  build:
    name: Production Build
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.run_build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Node.js and npm versions
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build

  browser-auth:
    name: Browser E2E — Auth
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.run_browser == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Node.js and npm versions
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser Auth E2E
        run: npm run test:e2e:auth
      - name: Upload Auth Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-auth
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  browser-operations:
    name: Browser E2E — Operations
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.run_browser == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Node.js and npm versions
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser Operations E2E
        run: npm run test:e2e:operations
      - name: Upload Operations Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-operations
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  validate:
    name: Validation & Non-Regression Gate
    if: ${{ always() }}
    needs: [detect-changes, static, unit_domain, server, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify selected validation lanes
        run: |
          set -euo pipefail
          test "${{ needs.detect-changes.result }}" = "success"

          if [ "${{ needs.detect-changes.outputs.run_static }}" = "true" ]; then
            test "${{ needs.static.result }}" = "success"
          else
            test "${{ needs.static.result }}" = "skipped"
          fi

          if [ "${{ needs.detect-changes.outputs.run_unit_domain }}" = "true" ]; then
            test "${{ needs.unit_domain.result }}" = "success"
          else
            test "${{ needs.unit_domain.result }}" = "skipped"
          fi

          if [ "${{ needs.detect-changes.outputs.run_server }}" = "true" ]; then
            test "${{ needs.server.result }}" = "success"
          else
            test "${{ needs.server.result }}" = "skipped"
          fi

          if [ "${{ needs.detect-changes.outputs.run_build }}" = "true" ]; then
            test "${{ needs.build.result }}" = "success"
          else
            test "${{ needs.build.result }}" = "skipped"
          fi

  browser-e2e:
    name: Browser E2E — OAuth/ESI composition
    if: ${{ always() }}
    needs: [detect-changes, browser-auth, browser-operations]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify selected browser lanes
        run: |
          set -euo pipefail
          detect_result="${{ needs.detect-changes.result }}"
          run_browser="${{ needs.detect-changes.outputs.run_browser }}"
          browser_auth_result="${{ needs.browser-auth.result }}"
          browser_operations_result="${{ needs.browser-operations.result }}"

          printf 'browser gate inputs: detect_result=%q run_browser=%q browser_auth=%q browser_operations=%q\n' \
            "$detect_result" "$run_browser" "$browser_auth_result" "$browser_operations_result"

          test "$detect_result" = "success"

          if [ "$run_browser" = "true" ]; then
            test "$browser_auth_result" = "success"
            test "$browser_operations_result" = "success"
          else
            test "$run_browser" = "false"
            test "$browser_auth_result" = "skipped"
            test "$browser_operations_result" = "skipped"
          fi
  required-gate:
    name: CI / required-gate
    if: ${{ always() }}
    needs: [detect-changes, validate, browser-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify stable certification result
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.detect-changes.result }}" = "success"
          test "${{ needs.validate.result }}" = "success"
          test "${{ needs.browser-e2e.result }}" = "success"

  observability:
    name: CI / observability
    if: ${{ always() }}
    needs: [required-gate]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
      - name: Verify Node.js and npm versions
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Collect CI timing and churn metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_OBSERVABILITY_FILE: ${{ runner.temp }}/ci-observability.json
          CI_CERTIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-observability.mjs
      - name: Upload CI observability metrics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-observability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-observability.json
          if-no-files-found: error
          retention-days: 30
