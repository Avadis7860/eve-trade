name: CI Foundation & Regression Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validation & Non-Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Backend typecheck
        run: npm run typecheck:server

      - name: Catalog & Universe truth tests
        run: npm run test:truth

      - name: Unit tests
        run: npm test

      - name: API integration tests
        run: npm run test:api

      - name: Server smoke test
        run: npm run test:smoke

      - name: Security hardening tests
        run: npm run test:security

      - name: ESI hardening & mock tests
        run: npm run test:esi

      - name: Production build
        run: npm run build
