name: CI Foundation & Regression Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validation & Non-Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Backend typecheck
        run: npm run typecheck:server

      - name: CI workflow contract tests
        run: npm run test:ci-config

      - name: Runtime configuration tests
        run: npm run test:config

      - name: EVE SSO JWT validation tests
        run: npm run test:auth-token

      - name: Catalog & Universe truth tests
        run: npm run test:truth

      - name: Corporation Treasury & ESI boundary tests
        run: npm run test:corporation-boundary

      - name: Unit tests
        run: npm test

      - name: API integration tests
        run: npm run test:api

      - name: Server smoke test
        run: npm run test:smoke

      - name: Security hardening tests
        run: npm run test:security

      - name: ESI hardening & mock tests
        run: npm run test:esi

      - name: Production build
        run: npm run build

  browser-e2e:
    name: Browser E2E — OAuth/ESI composition
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E — deterministic OAuth/ESI
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
