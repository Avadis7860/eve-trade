name: CI Foundation & Regression Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: CI / Change Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      domain: ${{ steps.scope.outputs.domain }}
      server: ${{ steps.scope.outputs.server }}
      sde: ${{ steps.scope.outputs.sde }}
      ci: ${{ steps.scope.outputs.ci }}
      config: ${{ steps.scope.outputs.config }}
      tests: ${{ steps.scope.outputs.tests }}
      docs: ${{ steps.scope.outputs.docs }}
      ambiguous: ${{ steps.scope.outputs.ambiguous }}
      full_certification: ${{ steps.scope.outputs.full_certification }}
    steps:
      - name: Checkout pull request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed domains
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo 'Base commit is not present locally; falling back conservatively to full certification.'
            changed_files=''
            ambiguous=true
          else
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            ambiguous=false
          fi

          frontend=false
          domain=false
          server=false
          sde=false
          ci=false
          config=false
          tests=false
          docs=false

          if [ -z "$changed_files" ]; then
            ambiguous=true
          fi

          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/workflows/*|.github/dependabot.yml)
                ci=true
                ;;
              src/engine/*)
                domain=true
                ;;
              src/services/*|server/*|server.ts)
                server=true
                ;;
              src/data/universeGraph.json|src/data/universeGraphManifest.ts|scripts/build-universe-graph.mjs|scripts/universe-graph-builder.mjs|scripts/write-universe-graph-manifest.mjs|scripts/__tests__/universe_graph_builder.test.mjs)
                sde=true
                ;;
              src/components/*|src/pages/*|src/hooks/*|src/App.*|src/main.*|public/*)
                frontend=true
                ;;
              tests/*|*/__tests__/*|*.test.ts|*.test.tsx|*.test.mjs)
                tests=true
                ;;
              package.json|package-lock.json|tsconfig*.json|vite.config.*|postcss.config.*|tailwind.config.*)
                config=true
                ;;
              docs/*|CONTRIBUTING.md|README.md)
                docs=true
                ;;
              *)
                ambiguous=true
                ;;
            esac
          done <<< "$changed_files"

          full_certification=false
          if [ "$ambiguous" = true ] || [ "$ci" = true ] || [ "$config" = true ] || [ "$domain" = true ] || [ "$server" = true ] || [ "$sde" = true ]; then
            full_certification=true
          fi

          {
            echo "frontend=$frontend"
            echo "domain=$domain"
            echo "server=$server"
            echo "sde=$sde"
            echo "ci=$ci"
            echo "config=$config"
            echo "tests=$tests"
            echo "docs=$docs"
            echo "ambiguous=$ambiguous"
            echo "full_certification=$full_certification"
          } >> "$GITHUB_OUTPUT"

          {
            echo '## Change Scope'
            echo
            echo '| Domain | Changed |'
            echo '|---|---:|'
            echo "| Frontend | $frontend |"
            echo "| Engine/domain | $domain |"
            echo "| Server/API/ESI | $server |"
            echo "| SDE/data | $sde |"
            echo "| CI/workflows | $ci |"
            echo "| Package/config | $config |"
            echo "| Tests | $tests |"
            echo "| Documentation | $docs |"
            echo "| Ambiguous/unclassified | $ambiguous |"
            echo
            if [ "$full_certification" = true ]; then
              echo '**Conservative fallback:** full certification remains required for this scope.'
            else
              echo '**Scope detection only:** no validation is skipped by this workflow yet.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
  static:
    name: Static / Config / Auth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Node.js and npm versions
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: CI workflow contract tests
        run: npm run test:ci-config
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Backend typecheck
        run: npm run typecheck:server
      - name: Runtime configuration tests
        run: npm run test:config
      - name: EVE SSO JWT validation tests
        run: npm run test:auth-token

  unit_domain:
    name: Unit / Domain Certification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Node.js and npm versions
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Catalog & Universe truth tests
        run: npm run test:truth
      - name: Corporation Treasury & ESI boundary tests
        run: npm run test:corporation-boundary
      - name: Unit tests
        run: npm test

  server:
    name: Server / API / Security / ESI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Node.js and npm versions
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: API integration tests
        run: npm run test:api
      - name: Server smoke test
        run: npm run test:smoke
      - name: Security hardening tests
        run: npm run test:security
      - name: ESI hardening & mock tests
        run: npm run test:esi

  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Node.js and npm versions
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build

  browser-auth:
    name: Browser E2E — Auth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Node.js and npm versions
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser Auth E2E
        run: npm run test:e2e:auth
      - name: Upload Auth Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-auth
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  browser-operations:
    name: Browser E2E — Operations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Node.js and npm versions
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser Operations E2E
        run: npm run test:e2e:operations
      - name: Upload Operations Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-operations
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  validate:
    name: Validation & Non-Regression Gate
    if: ${{ always() }}
    needs: [static, unit_domain, server, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify validation lanes
        run: |
          test "${{ needs.static.result }}" = "success"
          test "${{ needs.unit_domain.result }}" = "success"
          test "${{ needs.server.result }}" = "success"
          test "${{ needs.build.result }}" = "success"

  browser-e2e:
    name: Browser E2E — OAuth/ESI composition
    if: ${{ always() }}
    needs: [browser-auth, browser-operations]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify browser responsibility lanes
        run: |
          test "${{ needs.browser-auth.result }}" = "success"
          test "${{ needs.browser-operations.result }}" = "success"
  required-gate:
    name: CI / required-gate
    if: ${{ always() }}
    needs: [detect-changes, validate, browser-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify stable certification result
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.detect-changes.result }}" = "success"
          test "${{ needs.validate.result }}" = "success"
          test "${{ needs.browser-e2e.result }}" = "success"
